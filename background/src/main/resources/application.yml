spring:
  profiles:
    active: zpcdev # 指定application文件

  datasource:
    输入: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/relocateWeb?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8

  servlet:
    multipart:
      max-file-size: -1
      max-request-size: -1
      enabled: true

  mail:
    host: smtp.qq.com # QQ邮箱的 SMTP 服务器地址
    port: 587 # QQ邮箱推荐的 SMTP 端口（配合 STARTTLS）
    username: 2195445402@qq.com # 你的QQ邮箱账号
    password: gfhyjjampxvqdiig # 这里填写你的授权码
    properties:
      mail:
        smtp:
          auth: true # 需要SMTP认证
          starttls:
            enable: true # 启用 STARTTLS 加密
            # 如果你选择端口 465 并使用 SSL，则可以这样配置：
            # starttls:
            #   enable: false
            # ssl:
            #   enable: true
            debug: true # 开发阶段可以开启，查看详细的邮件发送日志

relocate:
  jwt:
    # 设置jwt签名加密时使用的秘钥
    back-secret-key: ahut
    # 设置jwt过期时间
    back-ttl: 72000000
    # 设置前端传递过来的令牌名称
    back-token-name: token

    front-secret-key: ahut
    front-ttl: 72000000
    front-token-name: authentication

  baidu:
    ak: XXX # 替换为实际的AK

# Bcrypt密码加密的强度，通常在10-12之间
# 较高的值提供更高的安全性，但会增加计算时间
  bcrypt:
    strength: 10

#upload:
#  image:
#    base-path: D:\\Java\\code\\RelocateWeb\\background\\src\\main\\resources\\static\\images\\
#    base-url: http://localhost:8080/images/

# 日志配置
logging:
  pattern:
    console: '%d{yyyy-MM-dd} [%thread] %-5level %logger- %msg%n'

mybatis:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.ahut.entity, com.ahut.dto, com.ahut.vo  # 类型别名所在包
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
